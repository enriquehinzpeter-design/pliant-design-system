<script type="text/babel">
// The external destinations Customer View can reach, mirroring the external app's own map.
const EXT_SCREENS = {
  dashboard: 'DashboardScreen', wallet: 'WalletScreen', accounts: 'AccountsScreen',
  cards: 'CardsScreen', 'card-requests': 'CardRequestsScreen',
  members: 'MembersScreen', teams: 'TeamsScreen',
  'not-exported': 'AccountingExportScreen', payments: 'PaymentsScreen',
  statements: 'StatementsScreen', rewards: 'RewardsScreen', merchants: 'MerchantsScreen',
  'settings-organization': 'SettingsScreen', 'settings-accounting': 'SettingsScreen',
  'settings-card-templates': 'SettingsScreen', 'settings-policies': 'PoliciesScreen',
  'settings-modules': 'ModulesScreen', 'settings-integrations': 'IntegrationsScreen',
};
window.EXT_SCREENS = EXT_SCREENS;
const INT_SCREENS = {
  organizations: 'IntOrganizationsScreen', 'int-members': 'IntMembersScreen',
  'int-transactions': 'IntTransactionsScreen', partners: 'IntPartnersScreen',
};
// Internal destinations whose captures are in hand but not built yet (tranche 2).
const INT_PENDING = {
  'int-merchants': ['Merchants', null],
  'program-settlements': ['Program Settlements', 'Settlements'],
  'settlement-accounts': ['Program Settlement Accounts', 'Settlements'],
  'settlement-files': ['Program Settlement Files', 'Settlements'],
  'customer-repayments': ['Customer Repayment Batches', 'Repayments'],
  'dd-collection-payout': ['Direct Debit Collection Payout', 'Repayments'],
  'receivable-repayments': ['Receivable Repayments', 'Repayments'],
  'customer-payouts': ['Payout Batches', 'Payouts'],
  'cashback-payments': ['Cashback Payment Batches', 'Payouts'],
  'compensation-payments': ['Compensation Batches', 'Payouts'],
  'repayment-approval': ['Repayment Accounts Approval', 'Compliance'],
  'coastal-templates': ['Coastal Report Templates', 'Compliance'],
  'update-terms': ['Update Terms or Policies', null],
};
function App() {
  const [screen, setScreen] = React.useState('organizations');
  const [org, setOrg] = React.useState(null);
  const nav = (s) => setScreen(s);
  if (org) return <CustomerView org={org} onExit={() => setOrg(null)} />;
  const name = INT_SCREENS[screen];
  if (name) { const S = window[name]; return <S screen={screen} onNavigate={nav} onOpenOrg={setOrg} />; }
  const [title, bc] = INT_PENDING[screen] || [screen, null];
  return (
    <InternalAppShell active={screen} onNavigate={nav} title={title} breadcrumb={bc}>
      <p style={{ marginTop: 40, fontFamily: 'var(--font-sans)', fontSize: 15, color: 'var(--text-secondary)' }}>Captured, not built yet — this screen arrives in internal tranche 2.</p>
    </InternalAppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
