<!-- @dsCard group="Colors" viewport="700x260" name="Semantic light / dark" subtitle="Each semantic colour ships light, main and dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page)}.sw{display:flex;gap:0;border-radius:var(--radius);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.15px}.grid{display:grid;gap:12px}.mono{font-variant-numeric:tabular-nums}.note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--divider);font-size:12px;line-height:166%;letter-spacing:.4px;color:var(--text-secondary)}</style></head><body><div class="grid" style="grid-template-columns:1fr">
<div style="display:flex;align-items:center;gap:12px"><span style="width:64px;font-size:11px;color:var(--text-secondary)">error</span><span style="flex:1;height:24px;background:#ff4d5c;border-radius:4px 0 0 4px"></span><span style="flex:1;height:24px;background:#e53948"></span><span style="flex:1;height:24px;background:#cc2937;border-radius:0 4px 4px 0"></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:64px;font-size:11px;color:var(--text-secondary)">warning</span><span style="flex:1;height:24px;background:#ff5500;border-radius:4px 0 0 4px"></span><span style="flex:1;height:24px;background:#e84d00"></span><span style="flex:1;height:24px;background:#b53c00;border-radius:0 4px 4px 0"></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:64px;font-size:11px;color:var(--text-secondary)">info</span><span style="flex:1;height:24px;background:#357eff;border-radius:4px 0 0 4px"></span><span style="flex:1;height:24px;background:#3073e8"></span><span style="flex:1;height:24px;background:#2659b5;border-radius:0 4px 4px 0"></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:64px;font-size:11px;color:var(--text-secondary)">success</span><span style="flex:1;height:24px;background:#14b8a6;border-radius:4px 0 0 4px"></span><span style="flex:1;height:24px;background:#0d9488"></span><span style="flex:1;height:24px;background:#0f766e;border-radius:0 4px 4px 0"></span></div><div style="display:flex;align-items:center;gap:12px"><span style="width:64px;font-size:11px;color:var(--text-secondary)">neutral</span><span style="flex:1;height:24px;background:#adb7c6;border-radius:4px 0 0 4px"></span><span style="flex:1;height:24px;background:#4b5563"></span><span style="flex:1;height:24px;background:#363e49;border-radius:0 4px 4px 0"></span></div>
</div><p class="note">main for fills and icons · dark for text and hover on a tinted fill · light for disabled or decorative fills. Do not interpolate new steps.</p></body></html>
