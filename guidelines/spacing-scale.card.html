<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page)}.sw{display:flex;gap:0;border-radius:var(--radius);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.15px}.grid{display:grid;gap:12px}.mono{font-variant-numeric:tabular-nums}.note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--divider);font-size:12px;line-height:166%;letter-spacing:.4px;color:var(--text-secondary)}</style></head><body><div style="display:flex;align-items:flex-end;gap:8px">
<div style="text-align:center"><div style="width:4px;height:4px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">16</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:#111;border-radius:2px"></div><div style="margin-top:6px;font-size:10px;color:var(--text-secondary)">64</div></div>
</div>
<div style="margin-top:12px;font-size:11px;color:var(--text-secondary)">MUI spacing(n) × 8px — spacing(5.25) = 42px is the tab-row height</div><p class="note">8px between related controls · 16px between fields in a form · 20–24px between sections · 32px page gutters. Fractional steps are legitimate — use the source value, do not snap to a 4/8 grid.</p></body></html>
