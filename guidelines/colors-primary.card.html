<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page)}.sw{display:flex;gap:0;border-radius:var(--radius);overflow:hidden}.sw>div{flex:1;height:64px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:10px;letter-spacing:.15px}.grid{display:grid;gap:12px}.mono{font-variant-numeric:tabular-nums}.note{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--divider);font-size:12px;line-height:166%;letter-spacing:.4px;color:var(--text-secondary)}</style></head><body><div class="sw"><div style="background:#111111;color:#fff"><span style="opacity:.75">main</span><span>#111111</span></div><div style="background:#424242;color:#fff"><span style="opacity:.75">light</span><span>#424242</span></div><div style="background:#111111;color:#fff"><span style="opacity:.75">dark</span><span>#111111</span></div><div style="background:#ffffff;color:rgba(0,0,0,.87)"><span style="opacity:.75">contrast</span><span>#ffffff</span></div></div>
<div style="margin-top:12px;font-size:12px;color:var(--text-secondary);letter-spacing:.4px">Buttons, checked controls, active indicators, links</div><p class="note">Use for every interactive affordance: contained buttons, checked controls, active tab indicator, slider track, links, focus ring. Never use a hue for "primary".</p></body></html>
