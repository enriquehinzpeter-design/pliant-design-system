<!-- @dsCard group="Brand" viewport="700x270" name="Card icons — in-app" subtitle="The 26×40 table-cell cards, per colourway and scheme — drawn as vector" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page)}.row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.cap{margin:7px 0 0;font-size:10px;letter-spacing:.4px;color:var(--text-secondary)}.note{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--divider);font-size:12px;line-height:166%;letter-spacing:.4px;color:var(--text-secondary)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.PliantDesignSystem_8f7377 || {};
const { CardIcon, CardRender } = NS;

function Demo() {
  if (!CardIcon) return <p className="note">Bundle not compiled yet.</p>;
  const CW = ['cream','lime','coral','orange','sage','taupe','black','metal'];
  const Row = ({ label, scheme, extra }) => <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 12 }}>
    <span style={{ width: 170, fontSize: 11, color: 'var(--text-secondary)' }}>{label}</span>
    {CW.map((c) => <CardIcon key={c} colourway={c} scheme={scheme} {...(extra || {})} />)}
  </div>;
  return <div>
    <Row label="Unbranded" scheme="none" />
    <Row label="Visa" scheme="visa" />
    <Row label="Mastercard" scheme="mastercard" />
    <Row label="Mastercard commercial" scheme="mastercard-commercial" />
    <Row label="1× single-use" scheme="visa" extra={{ singleUse: true }} />
    <p className="note">The icon size class is 26×40 native and renders ~30px tall in tables. Every colourway is drawn parametrically — no PNG slices, nothing to pixelate. Black and metal are the physical cards and carry the contact chip.</p>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
