<!-- @dsCard group="Brand" viewport="700x330" name="Card artwork — physical" subtitle="Black and metal, vector; front and back" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;font-family:var(--font-sans);background:var(--surface-page)}.row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}.cap{margin:7px 0 0;font-size:10px;letter-spacing:.4px;color:var(--text-secondary)}.note{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--divider);font-size:12px;line-height:166%;letter-spacing:.4px;color:var(--text-secondary)}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.PliantDesignSystem_8f7377 || {};
const { CardIcon, CardRender } = NS;

function Demo() {
  if (!CardRender) return <p className="note">Bundle not compiled yet.</p>;
  const common = { height: 170, type: 'physical', cardholder: 'Ada Lovelace', maskedNumber: '**** **** **** 9508', expiry: '09/28', cvv: '***' };
  return <div>
    <div className="row">
      <figure style={{ margin: 0 }}><CardRender colourway="black" scheme="visa" {...common} /><figcaption className="cap">black · Visa</figcaption></figure>
      <figure style={{ margin: 0 }}><CardRender colourway="black" scheme="mastercard" {...common} /><figcaption className="cap">black · Mastercard</figcaption></figure>
      <figure style={{ margin: 0 }}><CardRender colourway="black" scheme="visa" face="back" {...common} company="Analytical Engines Inc." number="4810 6321 1856 1782" expiry="05/29" cvv="820" /><figcaption className="cap">black · back</figcaption></figure>
      <figure style={{ margin: 0 }}><CardRender colourway="metal" scheme="visa" {...common} /><figcaption className="cap">metal · Visa</figcaption></figure>
    </div>
    <p className="note">Both physical cards are vector (Card Library node 4935:3695); the detail-view art is node 4935:2813. The black card has no texture in its source. Metal's brushed finish rides as a JPEG fill layer inside the vector geometry, opt-in via CardRender's texture prop and expected at assets/cards/metal-brushed.jpg — until it lands, metal shows its flat tone pair.</p>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
